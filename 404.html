<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<!-- GitHub Pages serves THIS file for every path it cannot find, at whatever
     depth the request came in on (/de/typo, /gpx/nope, /anything). Two things
     follow, and both are why this page is not built by tools/prerender.mjs:
       - every URL in here is absolute, and RunvisBase is "/" unconditionally,
         so the dictionary and i18n.js resolve from the site root rather than
         from the directory the visitor mistyped;
       - there is no per-language copy to point at, so there is no hreflang
         and i18n.js's language menu cannot build here (it derives its hrefs
         from location.pathname, which on this page is the address that did not
         exist). The boot script below resolves the visitor's language and
         i18n.js translates in place — which is exactly what the root pages did
         before the prerender existed.
     What the boot script did NOT do until now is move the three recovery
     buttons: it translated the page into German and then handed the reader
     three links to Korean pages (2026-09-06 라운드 15, -0.9). It rewrites them
     now, from data-page, and a row of six direct language links stands under
     them — plain <a>s to each market's home, which need neither i18n.js nor a
     dictionary and cannot be defeated by the mistyped path this file is being
     served for. check-content [24] runs the real script and checks where the
     three links end up.
     It is still held to the same standard as the rest of the site:
     check-content.mjs carries it in its EXTRA list, so [2], [3] and [8] cover
     its keys, its inline Korean defaults and its tags. -->
<title data-i18n="nf.title">이 주소에는 아무것도 없습니다 — Runvis</title>
<meta name="robots" content="noindex"/>
<meta content="#000000" name="theme-color"/>
<link href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏃&lt;/text&gt;&lt;/svg&gt;" rel="icon"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<style>
  :root{--green:#3DDC84;--cyan:#4CCBD9;--bg:#000;--bg2:#14171c;--line:#24282e;--line2:#2e333a;--text:#f2f3f5;--dim:#9aa0a6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;line-height:1.65;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif}
  :lang(ko) body{word-break:keep-all}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
  .wrap{max-width:560px}
  .logo{font-weight:900;font-size:22px;letter-spacing:-.02em}
  .logo b{color:var(--green)}
  .code{margin-top:26px;font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  /* The glyphs themselves are transparent, so anything that drops the gradient
     drops the word — and on this page the word is the only thing that says
     WHICH error it is. Same two fallbacks index.html and run.html carry for
     .grad; this was the third site of that pattern and the one nobody
     mentioned. */
  @supports not ((background-clip:text) or (-webkit-background-clip:text)){
    .code{background:none;color:var(--green);-webkit-text-fill-color:currentColor}
  }
  @media (forced-colors: active){
    .code{background:none;color:CanvasText;-webkit-text-fill-color:CanvasText;forced-color-adjust:none}
  }
  h1{margin-top:14px;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.25}
  p{margin-top:14px;color:var(--dim);font-size:15.5px}
  .links{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;background:linear-gradient(120deg,var(--green),var(--cyan));
    color:#04120c;font-weight:800;font-size:16px;padding:13px 24px;border-radius:14px}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line2)}
  .btn.ghost:hover{border-color:var(--green)}
  .langrow{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13.5px;color:var(--dim)}
  .langrow a{color:var(--dim);text-decoration:underline;text-underline-offset:3px}
  .langrow a:hover{color:var(--green)}
</style>
<script>
// The same language boot the five real pages run, minus two things.
//
// No redirect: there is no /de/404.html to send anyone to.
//
// And navigator.language still DECIDES here, where on every other page it only
// decides what the language banner offers (2026-09-06 라운드 14, -4). The
// reason that rule exists is that a page's rendered language has to match the
// hreflang, canonical and sitemap entry that name it. This file has none of
// the three — it is <meta name="robots" content="noindex">, it has no
// canonical, no alternates and no sitemap row, because GitHub Pages serves it
// for every path it cannot find at any depth. Nothing declares what language
// it is in, so nothing can disagree with what it renders, and the visitor is
// better served by their own language.
(function(){
  var L=["ko","en","ja","es","zh","de"];
  function norm(v){ if(!v) return null; v=String(v).toLowerCase();
    v = v.indexOf("zh")===0 ? "zh" : v.slice(0,2);
    return L.indexOf(v)>=0 ? v : null; }
  // Simplified-Chinese browsers are not handed the Traditional table; see the
  // same function and the same reason in i18n.js.
  function navLang(v){ var s=v?String(v).toLowerCase():"";
    return (s.indexOf("zh")===0 && !/^zh-(hant|tw|hk|mo)\b/.test(s)) ? null : norm(s); }
  var q=null; try{ q=new URLSearchParams(location.search).get("lang"); }catch(e){}
  var saved=null; try{ saved=norm(localStorage.getItem("runvis_lang")); }catch(e){}
  var code=norm(q)||saved||navLang(navigator.language)||"en";
  window.RunvisLang=code;
  window.RunvisBase="/";                      // this file answers from any depth
  document.documentElement.lang = code==="zh" ? "zh-Hant" : code;
  var d=document.createElement("script");
  d.src="/t-"+code+".js?v=20260906f"; d.async=false; document.head.appendChild(d);
  // i18n.js checks this before fetching a table of its own. Without it, a
  // German visitor to a mistyped URL downloaded t-de.js twice.
  window.RunvisDictLoaded=code;
  // The three recovery buttons are the only thing on this page a visitor can
  // act on, and they were hard-coded to the Korean root: a page that had just
  // decided the reader wanted German then offered three Korean documents. Each
  // one names its page in data-page and gets this language's prefix. Exposed
  // on window so tools/check-content.mjs [24] can run the real function
  // against the real markup rather than trusting this comment.
  window.RunvisFix404=function(doc){
    var pre = code==="ko" ? "/" : "/"+code+"/";
    var as = doc.querySelectorAll("a[data-page]"), i;
    for(i=0;i<as.length;i++){ as[i].setAttribute("href", pre + as[i].getAttribute("data-page")); }
    return pre;
  };
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",function(){ window.RunvisFix404(document); });
  } else { window.RunvisFix404(document); }
})();
</script>
</head>
<body>
<div class="wrap">
<a class="logo" href="/">Run<b>vis</b></a>
<div class="code" aria-hidden="true">404</div>
<h1 data-i18n="nf.h1">이 주소에는 아무것도 없습니다</h1>
<p data-i18n="nf.p">링크가 바뀌었거나 주소를 잘못 옮겨 적었을 수 있습니다. 이 사이트는 다섯 쪽뿐이고, 그중 셋이 아래에 있습니다.</p>
<div class="links">
<a class="btn" href="/" data-page="" data-i18n="nf.l1">홈으로</a>
<a class="btn ghost" href="/run.html" data-page="run.html" data-i18n="nf.l2">5km 데모 달려보기</a>
<a class="btn ghost" href="/how-it-works.html" data-page="how-it-works.html" data-i18n="nf.l3">규칙과 도구</a>
</div>
<!-- Six plain links, one per market home. No dictionary, no i18n.js, no
     hreflang: each label is that language's own name for itself, so the row
     reads correctly whatever language this page ended up rendering in. -->
<p class="langrow"><a href="/" lang="ko" hreflang="ko">한국어</a><a href="/en/" lang="en" hreflang="en">English</a><a href="/ja/" lang="ja" hreflang="ja">日本語</a><a href="/es/" lang="es" hreflang="es">Español</a><a href="/zh/" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a><a href="/de/" lang="de" hreflang="de">Deutsch</a></p>
</div>
<script defer src="/i18n.js?v=20260906f"></script>
</body>
</html>
