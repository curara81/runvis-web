<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<!-- GitHub Pages serves THIS file for every path it cannot find, at whatever
     depth the request came in on (/de/typo, /gpx/nope, /anything). Two things
     follow, and both are why this page is not built by tools/prerender.mjs:
       - every URL in here is absolute, and RunvisBase is "/" unconditionally,
         so the dictionary and i18n.js resolve from the site root rather than
         from the directory the visitor mistyped;
       - there is no per-language copy to point at, so there is no language
         menu and no hreflang. The boot script below resolves the visitor's
         language and i18n.js translates in place — which is exactly what the
         root pages did before the prerender existed.
     It is still held to the same standard as the rest of the site:
     check-content.mjs carries it in its EXTRA list, so [2], [3] and [8] cover
     its keys, its inline Korean defaults and its tags. -->
<title data-i18n="nf.title">이 주소에는 아무것도 없습니다 — Runvis</title>
<meta name="robots" content="noindex"/>
<meta content="#000000" name="theme-color"/>
<link href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏃&lt;/text&gt;&lt;/svg&gt;" rel="icon"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<style>
  :root{--green:#3DDC84;--cyan:#4CCBD9;--bg:#000;--bg2:#14171c;--line:#24282e;--line2:#2e333a;--text:#f2f3f5;--dim:#9aa0a6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;line-height:1.65;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif}
  :lang(ko) body{word-break:keep-all}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
  .wrap{max-width:560px}
  .logo{font-weight:900;font-size:22px;letter-spacing:-.02em}
  .logo b{color:var(--green)}
  .code{margin-top:26px;font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin-top:14px;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.25}
  p{margin-top:14px;color:var(--dim);font-size:15.5px}
  .links{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;background:linear-gradient(120deg,var(--green),var(--cyan));
    color:#04120c;font-weight:800;font-size:16px;padding:13px 24px;border-radius:14px}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line2)}
  .btn.ghost:hover{border-color:var(--green)}
</style>
<script>
// The same language boot the five real pages run, minus the redirect to a
// prerendered copy — there is no /de/404.html to send anyone to.
(function(){
  var L=["ko","en","ja","es","zh","de"];
  function norm(v){ if(!v) return null; v=String(v).toLowerCase();
    v = v.indexOf("zh")===0 ? "zh" : v.slice(0,2);
    return L.indexOf(v)>=0 ? v : null; }
  // Simplified-Chinese browsers are not handed the Traditional table; see the
  // same function and the same reason in i18n.js.
  function navLang(v){ var s=v?String(v).toLowerCase():"";
    return (s.indexOf("zh")===0 && !/^zh-(hant|tw|hk|mo)\b/.test(s)) ? null : norm(s); }
  var q=null; try{ q=new URLSearchParams(location.search).get("lang"); }catch(e){}
  var saved=null; try{ saved=norm(localStorage.getItem("runvis_lang")); }catch(e){}
  var code=norm(q)||saved||navLang(navigator.language)||"en";
  window.RunvisLang=code;
  window.RunvisBase="/";                      // this file answers from any depth
  document.documentElement.lang = code==="zh" ? "zh-Hant" : code;
  var d=document.createElement("script");
  d.src="/t-"+code+".js?v=20260906e"; d.async=false; document.head.appendChild(d);
})();
</script>
</head>
<body>
<div class="wrap">
<a class="logo" href="/">Run<b>vis</b></a>
<div class="code" aria-hidden="true">404</div>
<h1 data-i18n="nf.h1">이 주소에는 아무것도 없습니다</h1>
<p data-i18n="nf.p">링크가 바뀌었거나 주소를 잘못 옮겨 적었을 수 있습니다. 이 사이트는 다섯 쪽뿐이고, 그중 셋이 아래에 있습니다.</p>
<div class="links">
<a class="btn" href="/" data-i18n="nf.l1">홈으로</a>
<a class="btn ghost" href="/run.html" data-i18n="nf.l2">5km 데모 달려보기</a>
<a class="btn ghost" href="/how-it-works.html" data-i18n="nf.l3">규칙과 도구</a>
</div>
</div>
<script defer src="/i18n.js?v=20260906e"></script>
</body>
</html>
